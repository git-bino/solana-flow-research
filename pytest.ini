[pytest]
# `audit/phase0/` is a frozen snapshot of this repo taken for the external audit,
# so it contains a second copy of every test module.  Without this, pytest finds
# two modules with the same basename and aborts collection.  The snapshot is
# evidence, not a suite to run.
testpaths = tests
norecursedirs = audit .venv data results
markers =
    prec(n): run this test with Decimal precision n (see tests/test_cost_model.py)
